<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Cask Days 2026 Helper</title>
		<link rel="icon" href="data:image/svg+xml,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27><text y=%2714%27 font-size=%2714%27>🍺</text></svg>">
		<link rel="stylesheet" href="style.css">
	</head>
	<body>
		<header class="header">
			<h1>Cask Days 2026 Beer List</h1>
			<p class="updated">List updated <span id="last-updated"></span></p>
			<nav class="controls no-print">
				<button id="share" type="button">Share</button>
				<button id="toggle-view" type="button">Show Chosen Only</button>
				<button id="toggle-mode" type="button" class="mode">Enter Drinking Mode</button>
			</nav>
		</header>
		<main id="main"></main>
		<div id="toast" class="toast" role="status" hidden></div>
		<script type="module" src="app.js"></script>
	</body>
</html>
